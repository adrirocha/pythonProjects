<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit rating</title>
</head>
<body>
    <p>Book name: {{ book.title }}</p>
    <!-- Se o valor de rating terminar em .0 entao ele vira inteiro. Ex: 9.0 -> 9. -->
    {% set display_rating = book.rating %}
    {% if display_rating|string|last == "0" %}
      {% set display_rating = display_rating|round|int %}
    {% endif %}
    <p>Current rating: {{ display_rating }}</p>
    <form action="{{ url_for('edit', id=book.id) }}" method="POST">
        <input type="text" name=new_rating placeholder="New Rating">
        <button type=submit>Change Rating</button>
    </form>
</body>
</html>
